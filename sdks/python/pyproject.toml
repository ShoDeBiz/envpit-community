[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envpit"
version = "0.1.0"
description = "Official Python SDK for EnvPit — configuration & secrets management without enterprise complexity."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "EnvPit" }]
keywords = ["envpit", "configuration", "secrets", "config-management", "sdk"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# Zero runtime dependencies (ADR-S3-02) — stdlib urllib/json/threading/hashlib only.
dependencies = []

[project.urls]
Homepage = "https://docs.envpit.com"
Repository = "https://github.com/ShoDeBiz/envpit-community"
Issues = "https://github.com/ShoDeBiz/envpit-community/discussions"

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/envpit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"
packages = ["envpit"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
